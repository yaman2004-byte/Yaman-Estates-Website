<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <!-- Background Sun Disk in Upper Right -->
  <circle cx="132" cy="58" r="30" fill="#CA8C74" />

  <!-- Tower 1: Background Left Sand Facet -->
  <polygon points="82,88 94,66 94,142 82,126" fill="#CBB199" />

  <!-- Tower 2: Tallest Skyscraper (Main Center-Left) -->
  <!-- Left shaded side of Tower 2 -->
  <polygon points="94,40 104,50 104,148 94,142" fill="#D6C0AB" />
  <!-- Front crisp white face of Tower 2 with dark outline -->
  <polygon points="94,40 115,55 115,152 104,148" fill="#FDFBF7" stroke="#2B1408" stroke-width="2.2" stroke-linejoin="round" />
  <!-- Dark inner tower shadow / fluting -->
  <polygon points="104,50 115,58 115,152 104,148" fill="#3A1D0D" stroke="#2B1408" stroke-width="1.5" />

  <!-- Tower 3: Middle Dark Espresso Tower -->
  <!-- Deep espresso shaded face -->
  <polygon points="112,68 122,76 122,156 112,152" fill="#2E1307" stroke="#2B1408" stroke-width="1.8" stroke-linejoin="round" />
  <!-- Sand transition facet -->
  <polygon points="108,74 115,80 115,152 108,148" fill="#BFA38D" />

  <!-- Tower 4: Right Building (Front White Face with Bronze/Dark Outline) -->
  <polygon points="124,92 138,102 138,162 124,162" fill="#FDFBF7" stroke="#2B1408" stroke-width="2.2" stroke-linejoin="round" />
  <line x1="124" y1="92" x2="124" y2="162" stroke="#2B1408" stroke-width="2.2" stroke-linecap="round" />

  <!-- Diagonal Blade Gap / Cut Line (ivory background cutout) -->
  <polygon points="80,118 126,164 129,161 83,115" fill="#F4EBDD" />

  <!-- The "Y" Monogram (Cognac Bronze / Terracotta #8A431F) -->
  <!-- Main Y Body: Flowing left arm serif, diagonal blade, stem, and base plinth -->
  <path
    d="
      M 16 60
      C 24 60, 32 60, 42 60
      C 56 60, 68 64, 76 76
      C 84 88, 92 104, 126 156
      L 128 162
      L 121 162
      L 96 128
      L 96 156
      C 96 160, 98 162, 106 163
      L 106 165
      L 68 165
      L 68 163
      C 76 162, 78 160, 78 156
      L 78 124
      C 78 116, 74 104, 66 94
      C 56 82, 44 72, 30 65
      C 22 61, 18 61, 16 60
      Z
    "
    fill="#8A431F"
  />

  <!-- Top-left bracketed serif detail of the Y -->
  <path
    d="
      M 16 60
      C 26 59, 44 59, 70 60
      C 62 64, 58 68, 52 72
      C 42 63, 28 61, 16 60
      Z
    "
    fill="#8A431F"
  />

  <!-- Horizontal Architectural Baseline / Plinth Line -->
  <line x1="68" y1="165" x2="148" y2="165" stroke="#8A431F" stroke-width="2" stroke-linecap="square" />
</svg>
